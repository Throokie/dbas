name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "dbas/docs/**"
      - "dbas/frontend/**"
      - "dbas/README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation site
        run: |
          mkdir -p _site
          # Copy frontend dashboard
          cp -r dbas/frontend/dist _site/dashboard
          # Copy docs
          cp -r dbas/docs _site/docs
          # Build main page
          cp dbas/README.md _site/index.md
          # Copy example config
          cp dbas/dbas.example.toml _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
