# Executor profile: opencode
#
# Paste this [executor] block into dbas.toml and adjust args to match your
# installed opencode CLI version.

[executor]
type = "command"
command = "opencode"
args = ["run", "--cwd", "{workspace}"]
workdir = "{workspace}"
stdin_format = "text"
env = { DBAS_OUTPUT_REPORT = "{report}", DBAS_TASK_FILE = "{task_file}" }
